name: Build tun2socks Android bridge

on:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dtpro
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Checkout MIT tun2socks source
        run: |
          git clone https://github.com/xjasonlyu/tun2socks.git .native/tun2socks
          cd .native/tun2socks
          git checkout d24a734
          test "$(git show -s --format=%H)" = "d24a734"
          test -f LICENSE

      - name: Verify upstream tests
        working-directory: .native/tun2socks
        run: go test ./...

      - name: Build Android arm64 upstream binary
        working-directory: .native/tun2socks
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android27-clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-artifacts/arm64-v8a"
          go build -trimpath -buildvcs=false -ldflags='-s -w' \
            -o "$GITHUB_WORKSPACE/native-artifacts/arm64-v8a/tun2socks" ./cmd/tun2socks

      - name: Publish native artifact and license
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-android-arm64-d24a734
          path: |
            native-artifacts/
            .native/tun2socks/LICENSE
          if-no-files-found: error
