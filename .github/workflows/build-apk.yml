name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK (installable, debug-signed)
        id: debug_build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-debug.log
      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-gradle-diagnostic
          path: gradle-debug.log
          if-no-files-found: warn
      - name: Persist complete Gradle dependency diagnostic
        if: always()
        run: |
          grep -E -B3 -A8 "Could not resolve|Could not find|Could not GET|FAILURE:|What went wrong|error:" gradle-debug.log | tail -300 > gradle-error.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gradle-error.txt
          git diff --cached --quiet || git commit -m "ci: persist complete Gradle dependency diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Fail if debug build failed
        if: steps.debug_build.outcome == 'failure'
        run: exit 1

      - name: Build Release APK (unsigned, R8-optimized)
        run: ./gradlew assembleRelease --no-daemon

      - name: Get Version Name
        id: version
        run: |
          VERSION=$(sed -nE "s/.*versionName [\'\"]([^\'\"]+)[\'\"].*/\1/p" app/build.gradle | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # NOTE: with splits.abi enabled the outputs are app-<abi>-*.apk and
      # app-universal-*.apk — there is NO plain app-release-unsigned.apk.
      # The universal APK is what end users should download.

      - name: Upload Debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: AeroVPN-debug.apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AeroVPN-release-unsigned.apk
          path: app/build/outputs/apk/release/app-universal-release-unsigned.apk

      # softprops/action-gh-release already attaches the APKs — no separate
      # upload-release-asset step needed (the old one referenced a missing
      # step id and the wrong APK path, so it could never have worked).
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/release/app-universal-release-unsigned.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
