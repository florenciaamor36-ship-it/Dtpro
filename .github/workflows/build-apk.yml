name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle.zip
      - name: Build debug APK
        run: gradle-9.3.1/bin/gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dtpro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  native-tun2socks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dtpro
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Checkout MIT tun2socks
        run: |
          git clone https://github.com/xjasonlyu/tun2socks.git .native/tun2socks
          cd .native/tun2socks
          git checkout d24a734
          test -f LICENSE
      - name: Test upstream
        working-directory: .native/tun2socks
        run: go test ./...
      - name: Build Android arm64 artifact
        working-directory: .native/tun2socks
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android27-clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-artifacts/arm64-v8a"
          go build -trimpath -buildvcs=false -ldflags='-s -w' \
            -o "$GITHUB_WORKSPACE/native-artifacts/arm64-v8a/tun2socks" .
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-android-arm64-d24a734
          path: |
            native-artifacts/
            .native/tun2socks/LICENSE
          if-no-files-found: error
